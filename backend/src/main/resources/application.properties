spring.application.name=salmanhae

# DB
# Required: SUPABASE_DB_URL, SUPABASE_DB_USERNAME, SUPABASE_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# MyBatis
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.type-aliases-package=com.ssafy.salmanhae.model.dto
mybatis.configuration.map-underscore-to-camel-case=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Backend AI internal API
ai.agent.base-url=${AI_AGENT_BASE_URL:http://localhost:8000}
ai.agent.internal-api-key=${INTERNAL_API_KEY}
ai.agent.connect-timeout-ms=${AI_AGENT_CONNECT_TIMEOUT_MS:2000}
ai.agent.read-timeout-ms=${AI_AGENT_READ_TIMEOUT_MS:10000}

# Safety facility ingestion batch
safety.ingestion.scheduler.enabled=${SAFETY_INGESTION_SCHEDULER_ENABLED:false}
safety.ingestion.scheduler.cron=${SAFETY_INGESTION_SCHEDULER_CRON:0 0 3 1 * *}
safety.ingestion.scheduler.zone=${SAFETY_INGESTION_SCHEDULER_ZONE:Asia/Seoul}
